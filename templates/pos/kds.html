<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KDS — {{ owner.cafeName if owner else 'Kitchen' }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#4f46e5}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.top{height:56px;background:#020617;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;padding:0 1rem;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:1rem}
.ticket{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:180px}
.ticket.stuck{border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.3)}
.ticket-head{padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:.85rem}
.ticket-body{padding:1rem;flex:1}
.item{display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:.9rem}
.age{font-family:monospace;font-weight:700} .age.warn{color:#f59e0b} .age.danger{color:#ef4444}
.btn-bump{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:.4rem .7rem;font-weight:700;cursor:pointer}
.btn-bump:hover{background:#4338ca}
</style>
</head>
<body>
<div class="top">
  <a href="{{ url_for('web_owner.owner_dashboard') }}" class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--border);">← Dashboard</a>
  <strong><i class="bi bi-fire"></i> Kitchen Display</strong>
  <span id="clock" style="color:var(--muted);font-family:monospace;margin-left:.5rem;"></span>
  <span style="margin-left:auto;color:var(--muted);font-size:.85rem;"><span id="count">0</span> active • <span id="stuck">0</span> stuck</span>
  <button class="btn btn-sm" style="background:var(--accent);color:#fff;" onclick="load()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  <label style="display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.82rem;"><input type="checkbox" id="sound" checked/> Sound</label>
</div>
<div id="grid" class="grid"></div>
<audio id="ding" preload="auto" src="data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YYQAAAAAAA=="></audio>
<script>
const grid=document.getElementById('grid'), countEl=document.getElementById('count'), stuckEl=document.getElementById('stuck'), soundCb=document.getElementById('sound'), clock=document.getElementById('clock');
setInterval(()=>{ clock.textContent=new Date().toLocaleTimeString(); },1000);
let lastIds=new Set();
function load(){
  fetch('/api/kds/orders',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{
    const orders=d.orders||[];
    countEl.textContent=orders.length;
    const stuck=orders.filter(o=>o.isStuck).length;
    stuckEl.textContent=stuck;
    // ding on new ticket
    const ids=new Set(orders.map(o=>o.id));
    let hasNew=false;
    for(let id of ids){ if(!lastIds.has(id)){ hasNew=true; break; } }
    if(hasNew && soundCb.checked){ document.getElementById('ding').play().catch(()=>{}); }
    lastIds=ids;
    grid.innerHTML = orders.length ? orders.map(o=>`
      <div class="ticket ${o.isStuck?'stuck':''}">
        <div class="ticket-head">
          <span><strong>#${o.id}</strong> • ${escapeHtml(o.tableName||o.tableId||'Counter')} • ${escapeHtml(o.customerName)}</span>
          <span class="age ${o.ageSeconds>600?'danger':o.ageSeconds>300?'warn':''}">${o.ageLabel}</span>
        </div>
        <div class="ticket-body">
          ${o.items.map(it=>`<div class="item"><span>${it.quantity||1}× ${escapeHtml(it.name||'Item')}</span><span>${it.price? '₹'+Number(it.price).toFixed(0):''}</span></div>`).join('')}
          <div style="margin-top:.6rem;display:flex;justify-content:space-between;align-items:center;">
            <span style="color:var(--muted);font-size:.78rem;">${o.status} • ₹${Number(o.total||0).toFixed(0)}</span>
            <button class="btn-bump" onclick="bump(${o.id})">${o.status==='ready'?'Complete':'Bump → '+(o.status==='pending'?'Preparing':o.status==='preparing'?'Ready':'Done')}</button>
          </div>
        </div>
      </div>
    `).join('') : `<div style="grid-column:1/-1;text-align:center;padding:4rem;color:var(--muted);"><i class="bi bi-check-circle" style="font-size:2rem;"></i><div style="margin-top:.5rem;">No active tickets — kitchen clear.</div></div>`;
  }).catch(()=>{});
}
function bump(id){
  fetch(`/api/kds/orders/${id}/bump`,{method:'POST',headers:{'X-CSRFToken': document.querySelector('meta[name=csrf-token]')?.content || ''}, credentials:'same-origin'}).then(()=>load());
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
load(); setInterval(load, 5000);
</script>
</body>
</html>
