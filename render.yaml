# render.yaml — Cafe Ordering (Python / Flask / Gunicorn) — Free Tier
#
# FIXED 2026-09: Admin / Superadmin / Owner routes were inaccessible after Render deploy
# due to:
#   - No SUPERADMIN_* env vars → no superadmin account bootstrapped (login 403)
#   - Admin keys stored in ephemeral JSON file → wiped every restart
#   - ADMIN_SECRET_KEY random unknown to operator → cannot log into /admin
#   - Missing TRUSTED_PROXIES / session handling behind Render's TLS-terminating proxy
#
# Key design decisions for free tier:
#   - No preDeployCommand (paid feature) — migrations run in startCommand
#   - SECRET_KEY auto-generated by Render (generateValue: true)
#   - ADMIN_SECRET_KEY auto-generated by Render (generateValue: true)
#   - SUPERADMIN_PASSWORD auto-generated; copy from Dashboard → Environment
#   - startCommand uses semicolon (;) not && so gunicorn always starts
#     even if the migration script encounters a first-deploy timing issue
#
# Required secrets to set manually in Render Dashboard if you override:
#   BILLING_ENCRYPTION_KEY  — Fernet key, generate with:
#     python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
# After first deploy:
#   1. Render Dashboard → cafe-ordering → Environment
#   2. Copy SUPERADMIN_PASSWORD (and ADMIN_SECRET_KEY if you need legacy /admin)
#   3. Log in at /owner/login with superadmin username + that password
#   4. You instantly have /superadmin and /admin (auto-elevated) access
#
# Optional secrets (set as needed):
#   SENDGRID_API_KEY, MAIL_DEFAULT_SENDER   — transactional email
#   STRIPE_SECRET_KEY                        — Stripe payments
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET    — Razorpay payments
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_CLAIM_EMAIL — push notifications
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER — SMS
#   SENTRY_DSN                               — error tracking
#   OPS_HEALTH_TOKEN                         — /api/ops/health bearer token

databases:
  - name: cafe-ordering-db
    region: oregon
    plan: free
    databaseName: cafe_ordering
    user: cafe_user

services:

  # ── Managed Redis ────────────────────────────────────────────────────────────
  - type: redis
    name: cafe-ordering-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── Web service (Flask / Gunicorn) ───────────────────────────────────────────
  - type: web
    name: cafe-ordering
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    # Whole release phase capped at 10 min: every inner step already has its
    # own timeout, but this guarantees a wedged pre-boot can never burn the
    # ~15 min port-scan window again — gunicorn always gets a chance to bind.
    startCommand: "timeout 600 bash scripts/release.sh; python start.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TRUSTED_PROXIES
        value: "1"
      - key: OWNER_SIGNUP_MODE
        value: "open"
      # FIX: Render free Postgres = 5-10 max connections; default pool 25 would exhaust
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "10"
      # Auto-wired from managed services
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-ordering-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: cafe-ordering-redis
          type: redis
          property: connectionString
      # Auto-generated by Render on first deploy (64-char random string)
      # IMPORTANT: copy these from Dashboard → Environment after first deploy
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      # ── Superadmin bootstrap — FIX: was missing entirely, so no superadmin existed
      - key: SUPERADMIN_USERNAME
        value: "superadmin"
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        generateValue: true
      # Must be set manually in Render Dashboard for persistent encrypted credentials
      - key: BILLING_ENCRYPTION_KEY
        sync: false
      # Optional — set as needed
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_CURRENCY
        value: "gbp"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPS_HEALTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  # ── RQ background worker ──────────────────────────────────────────────────────
  - type: worker
    name: cafe-ordering-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "python rqworker.py"
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app
      - key: RQ_QUEUES
        value: default
      - key: WEBHOOK_RETRY_INTERVAL_SECS
        value: "300"
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-ordering-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: cafe-ordering-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BILLING_ENCRYPTION_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: SENTRY_DSN
        sync: false
